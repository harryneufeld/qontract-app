# Builds the Flutter web container and publishes it to GitHub Container Registry.
#
# The image contains no API URL: it is supplied at container start through
# QONTRACT_API_BASE_URL (see DEPLOY.md), so one image serves every environment.
#   push to main   -> main, sha-<short-sha>
#   tag vX.Y.Z     -> X.Y.Z, X.Y, latest, sha-<short-sha>
#   manual run     -> tags for the selected ref
#   pull request   -> build only, nothing is pushed
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/qontract-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=qontract-app
            org.opencontainers.image.description=qontract Flutter web client

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: qontract-app:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 -e QONTRACT_API_BASE_URL=https://api.example.com/api qontract-app:smoke
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/config.js | tee /dev/stderr | grep -q '"QONTRACT_API_BASE_URL": "https://api.example.com/api"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing.js)" = 404
          docker rm -f smoke
          # Without an API URL the container must refuse to start.
          if timeout 30 docker run --rm qontract-app:smoke; then
            echo "::error::Container started without QONTRACT_API_BASE_URL"; exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
