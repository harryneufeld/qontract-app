server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # App Links / Universal Links verification files (written at container start).
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }
    location ^~ /.well-known/ { try_files $uri =404; }

    # API mistakes must produce a real 404, never the Flutter HTML fallback.
    location ^~ /api { return 404; }
    location ^~ /_spa/ { internal; }

    # Missing assets must also return 404; index/bootstrap must revalidate on updates.
    location ~* \.(?:js|mjs|wasm|json|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|map|bin|bcmap)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /_spa/index.html;
    }
}
