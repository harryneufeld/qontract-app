name: qontract_app
description: Contract management Flutter app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.0
  file_picker: ^13.1.0
  path_provider: ^2.1.2
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.2
  path: ^1.9.1
  # In-app PDF preview (app#27); cross-platform incl. web.
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Brand slab-serif wordmark font (app#23). License:
    # assets/fonts/RobotoSlab-Apache-2.0.txt (Apache 2.0).
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab-Bold.ttf
          weight: 700
    # Body font, bundled so the web build never downloads Roboto from Google.
    # License: assets/fonts/Roboto-Apache-2.0.txt (Apache 2.0).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
