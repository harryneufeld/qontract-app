<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The value below is replaced with the value of the --base-href argument
    provided to `flutter build` at build time.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" name="viewport" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="qontract" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0369A1" />
  <title>qontract | Contract Management</title>
</head>
<body>
  <!--
    Sanitize the browser locale before the Flutter engine loads.

    On Linux hosts with a POSIX/C locale (LANG=C / POSIX / unset), the
    browser reports navigator.language as e.g. "en-US@posix", "C", or
    "POSIX". The Dart web engine builds its initial Locale from
    navigator.languages[0] and throws
      RangeError: Incorrect locale information provided
    during runApp() — before the first frame — leaving a white blank
    screen (issue #2).

    A valid BCP-47 base language is 2-3 letters. Anything else is
    replaced with "en-US" so the engine always receives a parseable tag.
  -->
  <script>
    (function () {
      var VALID_BASE = /^[a-zA-Z]{2,3}$/;
      function clean(language) {
        if (!language) return 'en-US';
        var base = String(language).split(/[@;]/)[0].trim();
        return VALID_BASE.test(base) ? base : 'en-US';
      }
      try {
        var languages =
          (navigator.languages && navigator.languages.length)
            ? navigator.languages.slice()
            : [navigator.language];
        var cleaned = languages.map(clean);
        if (!VALID_BASE.test(cleaned[0].split(/[-_]/)[0])) {
          cleaned[0] = 'en-US';
        }
        Object.defineProperty(window.navigator, 'languages', {
          get: function () { return cleaned; },
          configurable: true,
        });
        Object.defineProperty(window.navigator, 'language', {
          get: function () { return cleaned[0]; },
          configurable: true,
        });
      } catch (e) {
        // Some engines freeze navigator; nothing more we can do pre-engine.
        console.warn('qontract: could not sanitize navigator.language', e);
      }
    })();
  </script>

  <!--
    The Flutter web loader. This auto-discovers the compiled engine
    (main.dart.js / main.dart.mjs), the selected renderer (DOM or
    CanvasKit/Skwasm), and initializes the app. Sizing of the host
    element is handled by the loader itself, so no manual height CSS
    is required.
  -->
  <!-- Runtime settings (API URL) written by the web container at startup. -->
  <script src="config.js"></script>

  <!--
    PDF.js for in-app PDF previews (pdfx), served from this app instead of a
    CDN so no request leaves the deployment's own server.
  -->
  <script src="pdfjs/pdf.min.js" type="module"></script>
  <script type="module">
    globalThis.pdfjsLib.GlobalWorkerOptions.workerSrc =
        new URL('pdfjs/pdf.worker.min.js', document.baseURI).href;
    globalThis.pdfRenderOptions = {
      cMapUrl: new URL('pdfjs/cmaps/', document.baseURI).href,
      cMapPacked: true,
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
